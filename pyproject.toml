[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stereodetect"
version = "0.1.0"
description = "Training, evaluation, and explanations for five-class stereotype detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
training = ["torch>=2.2", "transformers>=5.17,<6", "accelerate>=1.0", "sentencepiece>=0.2", "wandb>=0.19"]
qwen = ["torch>=2.2", "transformers>=5.17,<6", "accelerate>=1.0", "peft>=0.20,<1", "wandb>=0.19"]
explanations = ["torch>=2.2", "transformers>=5.17,<6", "sentencepiece>=0.2", "lime>=0.2.0.1", "shap>=0.53,<0.54", "matplotlib>=3.8"]
reporting = ["matplotlib>=3.8"]
client = ["httpx>=0.27"]
serving = ["vllm>=0.22,<0.23"]
demo = ["vllm>=0.22,<0.23", "rich>=13.9"]
tracking = ["wandb>=0.19"]
dev = ["build>=1.2", "ruff>=0.9"]

[project.scripts]
stereodetect = "stereodetect.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["stereodetect*"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["stereodetect"]
